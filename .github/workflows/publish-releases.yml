# Publishes one GitHub Release per line of releases/releases.txt, with the text
# and picture from releases/notes/<tag>.md. Creates the tag when it is missing
# and updates the Release when it exists, so it is safe to re-run.
#
# The version list lives in releases/releases.txt, not here: the built-in token
# may not create a tag on a commit whose copy of this workflow differs from the
# one running, so a release must never need an edit to this file.
name: Publish releases

on:
  push:
    branches: [main]
    paths:
      - "releases/notes/**"
      - "releases/releases.txt"
      - ".github/workflows/publish-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update each release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list=$(grep -v '^#' releases/releases.txt | sed '/^$/d')
          latest=$(printf '%s\n' "$list" | tail -1 | cut -d'|' -f1)
          printf '%s\n' "$list" | while IFS='|' read -r tag target title; do
            [ "$target" = "HEAD" ] && target="$GITHUB_SHA"
            notes="releases/notes/${tag}.md"
            [ "$tag" = "$latest" ] && is_latest=true || is_latest=false
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes-file "$notes" --latest="$is_latest"
              echo "updated $tag"
            else
              gh release create "$tag" --target "$target" --title "$title" --notes-file "$notes" --latest="$is_latest"
              echo "created $tag at ${target:0:7}"
            fi
          done
